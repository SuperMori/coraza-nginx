name: Bump CI version pins

# Monthly refresh of .github/versions.env: resolve the latest nginx mainline +
# stable, latest Angie, latest OWASP CRS LTS, and latest libcoraza, re-pin each
# with a fresh sha256, and open a PR. Never commits to main directly — the PR
# runs the full ci-fast/build matrix as its own gate before a human merges.
#
# GitHub Actions themselves are pinned by SHA and bumped separately by renovate;
# this job only owns the upstream source-archive versions.
#
# If organization policy prevents GITHUB_TOKEN from opening pull requests, the
# prepared branch is still published and an issue with a comparison link is
# created. The automation never writes directly to main.

on:
  schedule:
    # 1st of the month, 04:30 UTC (after ci-deep's 03:30 monthly soak).
    - cron: "30 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bump-versions
  cancel-in-progress: false

jobs:
  bump:
    name: Recompute pins + open PR
    runs-on: ubuntu-26.04
    permissions:
      contents: write        # create the bump branch
      issues: write          # fallback when Actions-created PRs are disabled
      pull-requests: write   # open the PR
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't leave the token wired into .git/config for later run steps;
          # the push below authenticates explicitly via `gh auth setup-git`.
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Recompute versions.env
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/compute-versions.sh | tee /tmp/bump-summary.txt

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/versions.env; then
            echo "versions.env unchanged — nothing to bump."
            exit 0
          fi

          branch="ci/bump-versions-$(date -u +%Y%m)"
          # Re-establish git credentials (persist-credentials:false above).
          gh auth setup-git
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/versions.env
          git commit -m "ci: monthly bump of CI version pins"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          summary="$(cat /tmp/bump-summary.txt)"
          cat > /tmp/bump-pr.md <<EOF
          Monthly automated bump of \`.github/versions.env\` (nginx
          mainline/stable, Angie, OWASP CRS LTS, and libcoraza) with fresh
          SHA256 pins.

          \`\`\`
          ${summary}
          \`\`\`

          Opening the PR triggers the full CI and build matrix. It must pass
          before merge. No production bundle, release, or deployment is changed
          automatically.
          EOF

          # Reuse an existing open PR for this branch, else create one.
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            if gh pr edit "$branch" --body-file /tmp/bump-pr.md; then
              exit 0
            fi
          elif gh pr create --base main --head "$branch" \
            --title "ci: monthly CI version-pin bump ($(date -u +%Y-%m))" \
            --body-file /tmp/bump-pr.md; then
            exit 0
          fi

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          cat >> /tmp/bump-pr.md <<EOF

          The organization policy prevented GitHub Actions from opening the PR.
          Open the prepared comparison manually: ${compare_url}
          EOF
          bash .github/scripts/upsert-automation-issue.sh \
            "[Automation] Monthly version candidate $(date -u +%Y-%m)" \
            /tmp/bump-pr.md
