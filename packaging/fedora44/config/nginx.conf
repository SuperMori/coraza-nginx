load_module /opt/coraza-nginx/current/modules/ngx_http_coraza_module.so;

user nginx;
worker_processes auto;
error_log /opt/coraza-nginx/current/logs/error.log notice;
pid /opt/coraza-nginx/current/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /opt/coraza-nginx/current/conf/mime.types;
    default_type application/octet-stream;

    # Deliberately omit query strings, cookies, and request/response bodies.
    log_format privacy '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       'rt=$request_time rid=$request_id';
    access_log /opt/coraza-nginx/current/logs/access.log privacy;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    client_body_temp_path /opt/coraza-nginx/current/tmp/client_body;
    proxy_temp_path /opt/coraza-nginx/current/tmp/proxy;
    fastcgi_temp_path /opt/coraza-nginx/current/tmp/fastcgi;
    uwsgi_temp_path /opt/coraza-nginx/current/tmp/uwsgi;
    scgi_temp_path /opt/coraza-nginx/current/tmp/scgi;

    upstream smoke_origin {
        server 127.0.0.1:18094;
        keepalive 4;
    }

    # Safe loopback-only smoke configuration. Production routing and policy
    # belong in a private deployment repository, not in this public fork.
    server {
        listen 127.0.0.1:18093;

        location = /livez {
            coraza off;
            access_log off;
            return 200 "ok\n";
        }

        location / {
            coraza on;
            coraza_rules_file /opt/coraza-nginx/current/conf/coraza-rules.conf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_pass http://smoke_origin;
        }
    }

    server {
        listen 127.0.0.1:18094;
        access_log off;
        location / {
            return 204;
        }
    }
}
